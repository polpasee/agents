name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm run format:check
      - run: npm test -- --run
      - run: npm run coverage
      - run: npm run build
      # Gate on `critical` rather than `high`: the only outstanding high
      # advisory is GHSA-26hh-7cqf-hhc6 (Next.js middleware/proxy bypass), which
      # has no stable fix yet (canary-only) and does not apply here — this app
      # ships no Next.js middleware. Revert to `high` once a stable 16.3.x lands.
      - run: npm audit --audit-level=critical
        continue-on-error: false
